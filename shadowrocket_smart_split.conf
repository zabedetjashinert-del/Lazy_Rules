# 5. 中国 IP 兜底；放在 Global 之后，避免全球服务的域名规则被 IP 归属覆盖。
GEOIP,CN,DIRECT

# 6. 未知流量默认代理，避免新出现的国外服务因漏收录而打不开。
FINAL,国外代理

[Host]
localhost = 127.0.0.1
*.apple.com = server:system
*.icloud.com = server:system
